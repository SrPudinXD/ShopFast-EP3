name: ShopFast tests

on:
  push:
    branches:
      - main
      - review/cloud-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    name: Security unit tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-source-candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-source-candidate/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run security tests
        run: python -m pytest -q tests/
