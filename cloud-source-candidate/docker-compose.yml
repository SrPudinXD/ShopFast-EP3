# Servicios del snapshot EC2. Puertos ligados solo a loopback.
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopfast-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shopfast}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en el entorno}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: shopfast-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --appendfsync always
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
